name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1 – Server: typecheck + build
  # ─────────────────────────────────────────────
  server-build:
    name: Server – Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: TypeScript typecheck (no emit)
        run: npx tsc --noEmit

      - name: Compile TypeScript to JavaScript
        run: npm run build

  # ─────────────────────────────────────────────
  # Job 2 – Client: typecheck + Vite build
  # ─────────────────────────────────────────────
  client-build:
    name: Client – Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript typecheck + Vite build
        run: npm run build

  # ─────────────────────────────────────────────
  # Job 3 – Integration tests (needs MongoDB)
  # ─────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [server-build]

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Isolated test database – never touches production data
      MONGO_URI: mongodb://localhost:27017/ecommerce_test
      PORT: 5000
      JWT_SECRET: ci-test-secret
      REDIS_URL: ''

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Run checkout integration tests
        run: npx ts-node src/tests/checkout.test.ts
